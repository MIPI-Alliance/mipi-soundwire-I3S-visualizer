[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swi3s-studio"
version = "3.1.0"
description = "Desktop MIPI SoundWire I3S (SWI3S) bus analyzer + visualizer + timing suite"
requires-python = ">=3.11"
dependencies = [
    "swi3score>=0.1.0",   # the C++ decode core (build from ./native)
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "numpy>=1.23",
    "pyarrow>=12",
    "psutil>=5.9",     # actual-free-memory for the large-capture open guard
]

[project.gui-scripts]
swi3s-studio = "swi3s_studio.app:main"

[tool.setuptools]
packages = [
    "swi3s_studio",
    "swi3s_studio.ingest",
    "swi3s_studio.store",
    "swi3s_studio.model",
    "swi3s_studio.analysis",
    "swi3s_studio.dsp",
    "swi3s_studio.export",
    "swi3s_studio.timing",
    "swi3s_studio.ui",
    "swi3s_studio.ui.authoring",
    "swi3s_studio.swviz",            # first-party SWI3S Visualizer engine (was vendored)
    "swi3s_studio.swviz.config",
    "swi3s_studio.swviz.core",
    "swi3s_studio.swviz.drawing",
    "swi3s_studio.swviz.io",
    "swi3s_studio.swviz.models",
    "swi3s_studio.swviz.utils",
    "swi3s_studio.swviz.viz",
]
# The register map (data/registers.json) is installed alongside the app and located at
# runtime via sys.prefix/share (see model/registers.py _default_registers_json).
# Bundled peripheral register-map examples ship under share/swi3s-studio/regmaps
# (see model/regmap_import.py library_dir), and the demo workspaces under
# share/swi3s-studio/demos (see workspace.py demo_dir).
# (init.csv is a user-supplied local file, not packaged.)
[tool.setuptools.data-files]
"share/swi3s-studio" = ["data/registers.json"]
"share/swi3s-studio/regmaps" = ["data/regmaps/example_amp.json"]
"share/swi3s-studio/demos" = ["data/demos/phy1.swi3s", "data/demos/phy2.swi3s",
                              "data/demos/phy2_flow_control.swi3s", "data/demos/phy3.swi3s"]

# The theme's icons are read from beside ui/theme.py, so they ship inside the package.
[tool.setuptools.package-data]
"swi3s_studio.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A bare `pytest` is the functional suite. The perf ceilings are wall clocks and are only
# meaningful in their own process (`pytest -m perf`, as the gate and CI run them). An explicit
# -m on the command line overrides this.
addopts = ["-m", "not perf"]
# Warnings from this project's own modules are errors (scoped by module, so a dependency's
# warnings stay warnings). A ResourceWarning is raised from a finalizer, so pytest reports it
# as an unraisable-exception warning.
filterwarnings = [
    "error::DeprecationWarning:(swi3s_studio|test_|conftest)",
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "perf: performance-regression benchmark with a wall-clock ceiling (run: -m perf)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `scratch` is local debris (gitignored). It is listed here as well because ruff only honours
# .gitignore inside a git repository, and a copied tree without .git must lint the same.
# Ruff's own defaults cover .venv / build / dist / __pycache__ / .mypy_cache.
extend-exclude = ["native/build", "build", "dist", "scratch"]


[tool.ruff.lint]
# The ruleset covers real errors (F) and import hygiene (I), not layout preferences.
# Ignored: E501 (long lines), E402 (guarded imports), E741 (ambiguous names), E701/E702
# (colon / semicolon one-liners) and E731 (assigned lambda); the tree uses compact
# one-liners for Qt setup and short test fixtures.
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741", "E701", "E702", "E731"]

[tool.mypy]
# 3.12, not the 3.11 floor: mypy follows imports into installed stubs, and newer stubs
# (numpy's, for one) use 3.12+ syntax such as the `type` statement.
python_version = "3.12"
ignore_missing_imports = true       # PySide6 / pyqtgraph / pyarrow ship partial stubs
check_untyped_defs = false          # lenient start — the tree isn't fully annotated yet
warn_unused_ignores = false
exclude = ["native/build", "build", "dist", "scratch"]

[tool.coverage.run]
source = ["swi3s_studio"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

